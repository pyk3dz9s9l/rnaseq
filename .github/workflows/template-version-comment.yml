name: nf-core template version comment
jobs:
  template_version:
    runs-on: ubuntu-latest
    steps:
    - name: Check out pipeline code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        set +e
        if [ -f .nf-core.yml ]; then
          printf '%s\n' 'GERALT_DBG .nf-core.yml exists; content:'
          sed -n '1,80p' .nf-core.yml
        else
          printf '%s\n' "GERALT_DBG .nf-core.yml NOT FOUND (pwd=$(pwd))"
        fi
      continue-on-error: true
    - name: Read template version from .nf-core.yml
      uses: nichmor/minimal-read-yaml@1f7205277e25e156e1f63815781db80a6d490b8f
      id: read_yml
      with:
        config: ${{ github.workspace }}/.nf-core.yml
    - name: GERALT debug probe
      run: |-
        set +e
        probe_val='${{ toJSON(steps.read_yml.outputs.nf_core_version) }}'
        printf '%s\n' "GERALT_DBG nf_core_version output=${probe_val}"
      continue-on-error: true
    - name: Install nf-core
      run: |
        python -m pip install --upgrade pip
        pip install nf-core==${{ steps.read_yml.outputs['nf_core_version'] }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on: pull_request_target
