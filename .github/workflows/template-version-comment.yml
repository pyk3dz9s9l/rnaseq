name: nf-core template version comment
jobs:
  template_version:
    runs-on: ubuntu-latest
    steps:
    - name: Check out pipeline code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        printf 'GERALT_DBG workspace=%s\n' "$GITHUB_WORKSPACE"
        if [ -f .nf-core.yml ]; then
          printf 'GERALT_DBG .nf-core.yml present\n'
          sed -n 's/^nf_core_version:[[:space:]]*/GERALT_DBG nf_core_version_raw=/p' .nf-core.yml || true
        else
          printf 'GERALT_DBG .nf-core.yml MISSING\n'
        fi
      continue-on-error: true
    - name: Read template version from .nf-core.yml
      uses: nichmor/minimal-read-yaml@1f7205277e25e156e1f63815781db80a6d490b8f
      id: read_yml
      with:
        config: ${{ github.workspace }}/.nf-core.yml
    - name: GERALT debug probe
      run: |-
        v='toJSON(steps.read_yml.outputs['nf_core_version'])'
        printf 'GERALT_DBG read_yml.outputs.nf_core_version=%s\n' "$v"
      continue-on-error: true
    - name: Install nf-core
      run: |
        python -m pip install --upgrade pip
        pip install nf-core==${{ steps.read_yml.outputs['nf_core_version'] }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on: pull_request_target
