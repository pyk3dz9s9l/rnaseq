name: nf-core template version comment
jobs:
  template_version:
    runs-on: ubuntu-latest
    steps:
    - name: Check out pipeline code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: inspecting attacker-controlled .nf-core.yml before read'
        if [ -f "${GITHUB_WORKSPACE}/.nf-core.yml" ]; then
          printf '%s\n' 'GERALT_DBG: .nf-core.yml present'
          grep -n 'nf_core_version' "${GITHUB_WORKSPACE}/.nf-core.yml" || true
        else
          printf '%s\n' 'GERALT_DBG: .nf-core.yml missing'
        fi
      continue-on-error: true
    - name: Read template version from .nf-core.yml
      uses: nichmor/minimal-read-yaml@1f7205277e25e156e1f63815781db80a6d490b8f
      id: read_yml
      with:
        config: ${{ github.workspace }}/.nf-core.yml
    - name: GERALT debug probe
      run: |-
        set +e
        nf_core_version=${{ toJSON(steps.read_yml.outputs['nf_core_version']) }}
        printf '%s\n' "GERALT_DBG: nf_core_version output consumed by sink = ${nf_core_version}"
      continue-on-error: true
    - name: Install nf-core
      run: |
        python -m pip install --upgrade pip
        pip install nf-core==${{ steps.read_yml.outputs['nf_core_version'] }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on: pull_request_target
